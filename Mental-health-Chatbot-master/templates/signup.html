<!DOCTYPE html>
<html lang="en">
<head>
    <title>AI Guardian</title>
 
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600&display=swap" rel="stylesheet">
    <!--Stylesheet-->
    <style media="screen">
      *,
      *:before,
      *:after{
          padding: 0;
          margin: 0;
          box-sizing: border-box;
      }
      body{
          background-color: #080710;
          display: flex;
          justify-content: center;
          align-items: center;
          height: 100vh;
          overflow: hidden;
      }
      .background{
          width: 100%; /* Adjusted width */
          height: 100%; /* Adjusted height */
          position: absolute;
          top: 0;
          left: 0;
          background-image: url('https://www.freecodecamp.org/news/content/images/2022/09/jonatan-pie-3l3RwQdHRHg-unsplash.jpg'); /* Added background image */
          background-size: cover;
          background-position: center;
          filter: brightness(70%); /* Adjusted brightness */
      }
      .shape{
          height: 1000px;
          width: 200px;
          position: absolute;
          border-radius: 50%;
      }
      
      form{
          height: 700px;
          width: 400px;
          background-color: rgba(255,255,255,0.13);
          position: absolute;
          transform: translate(-50%,-50%);
          top: 50%;
          left: 50%;
          border-radius: 10px;
          backdrop-filter: blur(10px);
          border: 2px solid rgba(255,255,255,0.1);
          box-shadow: 0 0 40px rgba(8,7,16,0.6);
          padding: 50px 35px;
      }
      form *{
          font-family: 'Poppins',sans-serif;
          color: #ffffff;
          letter-spacing: 0.5px;
          outline: none;
          border: none;
      }
      form h3{
          font-size: 32px;
          font-weight: 500;
          line-height: 42px;
          text-align: center;
      }

      label{
          display: block;
          margin-top: 30px;
          font-size: 16px;
          font-weight: 500;
      }
      input, select {
          display: block;
          height: 50px;
          width: calc(100% - 20px);
          background-color: rgba(255,255,255,0.07);
          border-radius: 3px;
          padding: 0 10px;
          margin-top: 8px;
          font-size: 14px;
          font-weight: 300;
      }
      ::placeholder{
          color: #e5e5e5;
      }

      .error-message {
          font-size: 12px;
          color: red;
          margin-top: 5px;
      }
      button{
          margin-top: 30px;
          width: calc(100% - 20px);
          background-color: #ffffff;
          color: #080710;
          padding: 15px 0;
          font-size: 18px;
          font-weight: 600;
          border-radius: 5px;
          cursor: pointer;
      }

      select option {
          background-color: #080710;
          color: #ffffff;
          border: none;
      }

      select:focus {
          background-color: rgba(255,255,255,0.1);
      }
    </style>
</head>
<body>
    <div class="background"></div> <!-- Removed shapes from here -->
    <div class="background">
        <div class="shape"></div>
        <div class="shape"></div>
    </div>
    <form action="test">
        <h3>Sign Up</h3>

        <label for="username">Username:</label>
        <input type="text" placeholder="user name" id="username" required>

        <label for="password">Password:</label>
        <input type="password" placeholder="Password" id="password" required>

        <label for="Phone no:">phone number:</label>
        <input type="tel" pattern="[0-9]+" id="phone" placeholder="phone number" required>
        
        <label for="gender">Gender:</label>
        <select id="gender" name="gender" required>
            <option value="" disabled selected style="display:none;">Select Gender</option>
            <option value="male">Male</option>
            <option value="female">Female</option>
            <option value="other">Other</option>
        </select>
       
            <button type="submit">Sign Up </button>
        
    </form>

</body>
</html>
